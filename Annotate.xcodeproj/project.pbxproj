			shellScript = "# ADR 0017: `locate` is answered only for the annotate-mcp INSIDE this bundle,\n# identified by code signature and by inode. A build without the helper\n# refuses every locate, so bundling it is part of building the app rather\n# than something only the release workflow remembers — otherwise the day this\n# lands, locate stops working for everyone not running a tagged release.\n#\n# WHY ENABLE_USER_SCRIPT_SANDBOXING IS OFF FOR THIS TARGET, and only this\n# target: the script sandbox grants read access to exactly the paths declared\n# as inputs, so SwiftPM cannot read its own Package.swift, and even copying a\n# prebuilt product fails because .build/release is a symlink into a layout\n# that changes between toolchains. The AnnotateTests target keeps its sandbox.\n#\n# Its own scratch path, not Packages/AnnotateMCP/.build: a build driven from\n# Xcode and one driven from a terminal would otherwise contend for the same\n# SwiftPM lock.\nset -e\nswift build -c release \\\n  --package-path \"$SRCROOT/Packages/AnnotateMCP\" \\\n  --scratch-path \"$DERIVED_FILE_DIR/annotate-mcp\"\ninstall -m 755 \\\n  \"$DERIVED_FILE_DIR/annotate-mcp/release/annotate-mcp\" \\\n  \"$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/annotate-mcp\"\n";
