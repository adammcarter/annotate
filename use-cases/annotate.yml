    trigger: Marks with labels are drawn one at a time over the same region.
    scenarios:
      - id: annotate.ink.labels.main
        kind: steps
        steps:
          - Draw four labelled loops down a tightly stacked tool column, one at a time.
          - Add a labelled arrow, a highlight and an underline over the same area.
          - Pass the target window as `within` on each command.
      - id: annotate.ink.labels.crowded
        kind: steps
        steps:
          - Keep drawing labelled marks until every position beside the marks is taken.
    observable_outcomes:
      - No label overlaps another label, any mark's ink, its own target, or its own arrow shaft.
      - Marks themselves may overlap freely — they still land exactly on their targets.
      - Every label stays inside the window given as `within`.
      - A label pushed clear of its mark is joined to it by a faint line, trimmed at both ends; an arrow's label never grows one.
      - A label displaced by a later mark ANIMATES to its new position rather than jumping.
      - When every slot beside a mark is taken, the label still finds free space rather than covering something.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
          minimum_count: 1
    approval_policy:
      mode: none

  - id: annotate.ink.yield
    title: Marks under the pointer get out of the way — all of them, by their real shape
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: common
    tags:
      - ink
      - interaction
    source_refs:
      - kind: file
        path: Annotate/Overlay/AnnotationInteraction.swift
    actor: user
    intent: Look at, and click, the thing an annotation is drawn on without clearing the annotation first.
    preconditions:
      - Annotate.app running with several overlapping marks on screen.
    trigger: The pointer moves over the annotations, and a button is held.
    scenarios:
      - id: annotate.ink.yield.main
        kind: steps
        steps:
          - Move the pointer onto ink shared by two overlapping marks.
          - Move the pointer into the empty middle of a loop.
          - Move the pointer to where a label used to be before a later mark displaced it.
    observable_outcomes:
      - Every mark under the pointer dims together, not only the topmost.
      - The empty middle of a loop is not the loop — marks stay at full strength there.
      - Approaching a stroke within a few points counts as hovering it.
      - A label plate is solid, so anywhere inside it counts.
      - Nothing dims at a position a mark has moved away from.
      - Holding the button hides the marks under the pointer; releasing restores them; clicks reach the app underneath.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
          minimum_count: 1
    approval_policy:
      mode: none
