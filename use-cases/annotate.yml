  - id: annotate.tool.locate
    title: "MCP tool: annotate_locate resolves on-screen elements to real frames"
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - mcp
      - tool
      - accessibility
    source_refs:
      - kind: file
        path: Annotate/Accessibility/AXLocator.swift
      - kind: file
        path: Packages/AnnotateMCP/Sources/AnnotateMCPKit/ToolCatalog.swift
    actor: agent
    intent: >-
      Close the loop between seeing and marking. Every other tool takes coordinates
      the agent had to work out from a screenshot; this one asks the system where
      a control actually IS. Without it an agent teaching a real app is guessing
      pixel positions, and a guess that is 20pt out circles the wrong button.
    preconditions:
      - Annotate has been granted Accessibility permission in System Settings.
      - The target application is running.
      - The call arrives through the annotate-mcp INSIDE the installed app bundle, and the agent host that started it has been approved (ADR 0017).
    trigger: An MCP client calls the tool with one or more element queries.
    scenarios:
      - id: annotate.tool.locate.main
        kind: steps
        steps:
          - Query a running app for elements by role and by contained text, in one batch.
          - Feed a returned frame straight into a draw command.
    observable_outcomes:
      - Every match carries a full frame {x,y,w,h} in the same global top-left points the draw tools take, so a match can be drawn on with no conversion.
      - ALL matches are returned, never a single ranked guess — the agent picks, using the ancestry path, owning window and enabled/focused state supplied alongside each.
      - Multiple queries resolve in ONE tree walk, so locating ten controls costs one traversal rather than ten.
      - It is app-agnostic — anything exposing the macOS Accessibility API, with no per-app special-casing.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
          minimum_count: 1
    approval_policy:
      mode: none
  - id: annotate.control.peertrust
    title: "The control socket answers reads only for Annotate's own bridge, started by an approved host"
    lifecycle: active
    value_tier: core
    journey_role: edge
    usage_frequency: common
    tags:
      - security
      - protocol
    source_refs:
      - kind: file
        path: Annotate/Control/PeerAuthority.swift
      - kind: file
        path: Annotate/Control/UnixSocketListener.swift
      - kind: file
        path: docs/adr/0017-the-control-socket-verifies-who-is-calling.md
    actor: user
    intent: >-
      Annotate holds the Accessibility grant; the socket does not. Without this,
      any process running as the user — a script, an npm postinstall — could read
      any application's interface through Annotate's grant having been granted
      nothing itself. Drawing stays ungated, because it adds no authority a local
      process does not already have.
    preconditions:
      - Annotate is running and its socket exists.
      - annotate-mcp is present inside the app bundle.
    trigger: Anything connects to the control socket and issues a command.
    scenarios:
      - id: annotate.control.peertrust.refuses-a-stranger
        kind: steps
        steps:
          - Send `locate` down the socket from a plain script (Tools/sock-cmd.py).
          - The reply is ok with coverage `not_authorized`, no results and NO window frames.
          - Send a draw command from the same script; it draws.
      - id: annotate.control.peertrust.asks-once-per-host
        kind: steps
        steps:
          - Call `locate` through the bundled bridge from a host Annotate has not seen.
          - The reply is coverage `approval_pending` within the client's timeout, and ONE panel appears.
          - Answer it; the next call resolves elements, and no further panel appears for that host.
    observable_outcomes:
      - A refused caller learns nothing — not even whether the app it named is running — because the tree is never walked.
      - The socket is mode 0600 from the instant it is created, not from when the listener goes ready.
      - Drawing is never gated, in any refusal state, and never consults the signature check at all.
      - "The answer is remembered per host by CODE SIGNATURE: moving an approved binary keeps the approval, replacing it loses it."
      - Approvals are visible and revocable from the menu, under Approved Agent Hosts.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
