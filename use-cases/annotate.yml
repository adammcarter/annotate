schema_version: 1
feature:
  id: annotate
  name: Annotate — agent-driven screen annotations
  summary: AI agents draw ephemeral hand-drawn annotations (circle, highlight, underline, arrow, text) on a transparent click-through macOS overlay, via MCP -> unix socket.
metadata:
  owner: maintainers
  lifecycle: active
use_cases:
  - id: annotate.protocol.draw
    title: Socket draw command renders an annotation and returns its id
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - protocol
      - socket
    source_refs:
      - kind: file
        path: Annotate/Control/ControlPlane.swift
    actor: agent
    intent: Draw a circle on screen by sending one ND-JSON line to the control socket.
    preconditions:
      - Annotate.app built; socket path available.
    trigger: A circle command arrives on the unix socket.
    scenarios:
      - id: annotate.protocol.draw.main
        kind: steps
        steps:
          - Connect to the socket (app auto-launched if needed).
          - Send ping, then a circle command with a target rect.
          - Read the replies.
    observable_outcomes:
      - ping returns version 1.
      - circle returns ok:true and an annotationId; the shape animates on screen.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
          minimum_count: 1
    approval_policy:
      mode: none
  - id: annotate.protocol.validation
    title: Invalid input is rejected with the contract's error codes
    lifecycle: active
    value_tier: core
    journey_role: edge
    usage_frequency: common
    tags:
      - protocol
      - validation
    source_refs:
      - kind: file
        path: Packages/AnnotateCore/Sources/AnnotateCore/Protocol.swift
    actor: agent
    intent: Receive precise machine-readable errors for malformed or invalid commands.
    preconditions:
      - Annotate.app running.
    trigger: Unknown command, oversize text, or non-positive geometry is sent.
    scenarios:
      - id: annotate.protocol.validation.main
        kind: steps
        steps:
          - Send an unknown command; send >300-char text; send a negative-size rect.
    observable_outcomes:
      - unknown_cmd and invalid_params error codes come back; nothing draws.
    host_applicability:
      - host_surface: unknown
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - acceptance
          minimum_count: 1
    approval_policy:
      mode: none
